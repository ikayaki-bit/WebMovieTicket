<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body style="font-family: sans-serif; padding: 40px; background-color: #f8f9fa;">
    <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #dee2e6;">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
        </form>
        <p style="margin-top: 15px;"><a href="{% url 'signup' %}">Sign up</a> | <a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
